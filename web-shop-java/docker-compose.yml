services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${DB_NAME:-webshop}
      POSTGRES_USER: ${DB_USER:-webshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-webshop_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Local database tools can use localhost:5432; the app uses db:5432.

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-webshop}
      DB_USER: ${DB_USER:-webshop}
      DB_PASSWORD: ${DB_PASSWORD:-webshop_dev}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
